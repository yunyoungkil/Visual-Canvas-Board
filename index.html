<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비주얼 캔버스 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <style>
      .ProseMirror {
        height: 100%;
      }
      .ProseMirror:focus {
        outline: none;
      }
      .ProseMirror a {
        color: #3b82f6; /* blue-500 */
        text-decoration: underline;
        cursor: pointer;
      }
      .ProseMirror a:hover {
        color: #2563eb; /* blue-600 */
      }
      .ProseMirror strong {
        font-weight: bold;
      }
      .ProseMirror em {
        font-style: italic;
      }
      .ProseMirror mark {
        background-color: #fef08a;
        padding: 0.125rem 0.25rem;
        border-radius: 0.125rem;
      }
      .tiptap-toolbar button.is-active {
        background-color: #e0e7ff;
        color: #4f46e5;
      }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: #adb5bd;
        pointer-events: none;
        height: 0;
      }
      /* Styles for Tiptap content to override Tailwind's reset */
      .ProseMirror p {
        margin-bottom: 0.75em;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: break-word;
        word-wrap: break-word;
        hyphens: auto;
        max-width: 100%;
      }
      .ProseMirror p:last-child {
        margin-bottom: 0;
      }
      .ProseMirror h1 {
        font-size: 2em;
        font-weight: bold;
        margin-top: 1em;
        margin-bottom: 0.5em;
        line-height: 1.2;
      }
      .ProseMirror h1:first-child {
        margin-top: 0;
      }
      .ProseMirror h2 {
        font-size: 1.5em;
        font-weight: bold;
        margin-top: 0.83em;
        margin-bottom: 0.5em;
        line-height: 1.3;
      }
      .ProseMirror h2:first-child {
        margin-top: 0;
      }
      .ProseMirror h3 {
        font-size: 1.25em;
        font-weight: bold;
        margin-top: 0.75em;
        margin-bottom: 0.5em;
        line-height: 1.4;
      }
      .ProseMirror h3:first-child {
        margin-top: 0;
      }
      .ProseMirror h4 {
        font-size: 1.125em;
        font-weight: 600;
        margin-top: 0.67em;
        margin-bottom: 0.5em;
        line-height: 1.5;
      }
      .ProseMirror h4:first-child {
        margin-top: 0;
      }
      .ProseMirror blockquote {
        border-left: 4px solid #d1d5db;
        padding-left: 1rem;
        margin: 1em 0;
        color: #6b7280;
        font-style: italic;
      }
      .ProseMirror blockquote p {
        margin-bottom: 0.5em;
      }
      .ProseMirror ul {
        list-style-type: disc;
        padding-left: 2rem;
        margin: 1em 0;
      }
      .ProseMirror ul li {
        margin-bottom: 0.25em;
        line-height: 1.6;
      }
      .ProseMirror ol {
        list-style-type: decimal;
        padding-left: 2rem;
        margin: 1em 0;
      }
      .ProseMirror ol li {
        margin-bottom: 0.25em;
        line-height: 1.6;
      }
      .ProseMirror img {
        display: inline-block;
        max-width: 100%;
        height: auto;
        border-radius: 0.25rem;
      }
      .ProseMirror img.ProseMirror-selectednode {
        outline: 3px solid #60a5fa;
      }
      /* Code block styles */
      .ProseMirror code {
        background-color: #f3f4f6;
        color: #e11d48;
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-size: 0.875em;
        font-family: "Courier New", monospace;
      }
      .ProseMirror pre {
        background-color: #1f2937;
        color: #f9fafb;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 1em 0;
        line-height: 1.5;
      }
      .ProseMirror pre code {
        background-color: transparent;
        color: inherit;
        padding: 0;
        font-size: 0.875rem;
      }
      /* Horizontal rule styles */
      .ProseMirror hr {
        margin: 50px 0;
        border: none;
        border-top: 2px solid #d1d5db;
        cursor: default;
        position: relative;
        padding: 8px 0;
        pointer-events: none; /* 기본적으로 상호작용 비활성화 */
        -webkit-user-select: none;
        user-select: none;
      }
      /* 편집 모드에서만 상호작용 활성화 */
      .ProseMirror.editing-mode hr {
        cursor: pointer;
        pointer-events: auto;
        -webkit-user-select: auto;
        user-select: auto;
      }
      .ProseMirror.editing-mode hr:hover {
        border-top-color: #9ca3af;
        border-top-width: 3px;
      }
      .ProseMirror.editing-mode hr.ProseMirror-selectednode {
        border-top-color: #60a5fa;
        border-top-width: 4px;
        outline: 2px solid #bfdbfe;
        outline-offset: 4px;
      }
      /* Table styles with resize handles */
      .ProseMirror table {
        border-collapse: collapse;
        table-layout: fixed;
        width: 100%;
        margin: 1rem 0;
        overflow: hidden;
        position: relative;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      .ProseMirror td,
      .ProseMirror th {
        min-width: 1em;
        border: 2px solid #d1d5db;
        padding: 0.5rem 0.75rem;
        vertical-align: top;
        box-sizing: border-box;
        position: relative;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      .ProseMirror th {
        font-weight: bold;
        text-align: left;
        background-color: #f3f4f6;
      }
      .ProseMirror .selectedCell {
        background-color: #dbeafe;
      }
      /* Column resize handle */
      .ProseMirror .column-resize-handle {
        position: absolute;
        right: -2px;
        top: 0;
        bottom: -2px;
        width: 4px;
        background-color: #3b82f6;
        pointer-events: none;
        z-index: 20;
      }
      .ProseMirror.resize-cursor {
        cursor: col-resize;
      }
      /* Table selected state */
      .ProseMirror table.selectedTable {
        outline: 2px solid #60a5fa;
      }
      /* Editing mode: enable text selection and interaction */
      .ProseMirror.editing-mode table,
      .ProseMirror.editing-mode td,
      .ProseMirror.editing-mode th {
        -webkit-user-select: text;
        user-select: text;
        pointer-events: auto;
      }
      /* Non-editing mode: disable all interactions */
      .ProseMirror:not(.editing-mode) {
        -webkit-user-select: none;
        user-select: none;
      }
      .ProseMirror:not(.editing-mode) img {
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .ProseMirror:not(.editing-mode) .resize-handle {
        display: none;
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
